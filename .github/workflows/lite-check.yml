# openccu-lite: the fork's checks on GitHub-hosted runners, for every push to main and every pull
# request. lite-only file, never part of an upstream PR.
#
# The shell tests of scripts/testcases run against stand-ins and need no build tree, so they run
# on ubuntu-latest. The image build, its guards and the boot test run on the project's own build host
# (lite-build.yml there, which is skipped on GitHub). No secrets, read-only: a pull request from a
# fork runs this as it is.
name: lite-check

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lite-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    if: github.server_url == 'https://github.com'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - name: Tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq rsync openssl python3 shellcheck tcl > /dev/null
      - name: No roadmap ids in the lite overlays
        run: |
          sh scripts/testcases/lite-id-guard-test.sh
          sh scripts/lite-id-guard.sh
      - name: Upstream's shellcheck rules on the delta
        run: sh scripts/lite-shellcheck.sh
      - name: The upstream paths the fork removed stay removed
        run: sh scripts/testcases/lite-upstream-merge-test.sh
      - name: The journal is the one log
        run: |
          sh scripts/testcases/lite-log-guard-test.sh
          sh scripts/testcases/hmipserver-log4j2-test.sh
          sh scripts/testcases/lite-journal-persist-test.sh
          sh scripts/testcases/lite-journal-sync-test.sh
          sh scripts/testcases/lite-syslog-forward-test.sh
          sh scripts/testcases/multimacd-loglevel-test.sh
          sh scripts/testcases/lite-recovery-log-test.sh
          sh scripts/testcases/lite-recovery-hbrf-led-test.sh
      - name: The out-of-tree modules carry the kernel's key
        run: sh scripts/testcases/lite-module-sig-guard-test.sh
      - name: The Pi kernel maps USB buffers directly (B-91's assumption)
        run: sh scripts/testcases/lite-kernel-dma-guard-test.sh
      - name: irqbalance leaves the IRQs alone whose affinity the kernel fixes
        run: sh scripts/testcases/lite-irqbalance-test.sh
      - name: The boot script is the product's boot.cmd
        run: sh scripts/testcases/lite-bootscr-check-test.sh
      - name: A kernel patch path that applies nothing is a build warning
        run: sh scripts/testcases/lite-kernel-patch-check-test.sh
      - name: The Pi 4/5 bootloader update is offered, not flashed
        run: sh scripts/testcases/lite-rpi-eeprom-offer-test.sh
      - name: /VERSION's lite lines and the three-part firmware version
        run: sh scripts/testcases/lite-version-file-test.sh
      - name: The binaries carry the build's hardening flags
        run: sh scripts/testcases/lite-hardening-guard-test.sh
      - name: occulited in the image is the pinned commit
        run: sh scripts/testcases/lite-occulited-version-guard-test.sh
      - name: The WebUI's files for addons
        run: sh scripts/testcases/lite-webui-files-test.sh
      - name: openccu-base builds only the paths openccu-base-paths.txt lists
        run: sh scripts/testcases/lite-openccu-base-paths-test.sh
      - name: HMServer.jar for VirtualDevices without an HmIP module
        run: sh scripts/testcases/lite-hmserver-jar-test.sh
      - name: npm purls by the purl spec
        run: sh scripts/testcases/lite-sbom-npm-purl-test.sh
      - name: The piVCCU packages' bump helpers pin the fork
        run: sh scripts/testcases/lite-pivccu-update-test.sh
      - name: The nested builds are keyed on their own inputs
        run: sh scripts/testcases/lite-nested-build-keys-test.sh
      - name: The boot order and the boot path
        run: |
          sh scripts/testcases/lite-unit-order-test.sh
          sh scripts/testcases/lite-network-reload-test.sh
          sh scripts/testcases/lite-default-hostname-test.sh
          sh scripts/testcases/occu-addons-generator-test.sh
          sh scripts/testcases/lite-addon-delay-test.sh
          sh scripts/testcases/lite-addon-own-test.sh
          sh scripts/testcases/lite-lighttpd-addon-socket-test.sh
          sh scripts/testcases/lite-addon-payload-test.sh
          sh scripts/testcases/lite-radio-gate-test.sh
          sh scripts/testcases/addon-rc-wrapper-test.sh
          sh scripts/testcases/lite-install-addon-test.sh
          sh scripts/testcases/lite-addon-rc-test.sh
          sh scripts/testcases/lite-init-addons-test.sh
          sh scripts/testcases/lite-initscripts-test.sh
          sh scripts/testcases/lite-boot-path-test.sh
          sh scripts/testcases/lite-extension-dirs-test.sh
          sh scripts/testcases/lite-machine-id-test.sh
          sh scripts/testcases/lite-clock-save-test.sh
          sh scripts/testcases/lite-clock-valid-test.sh
          sh scripts/testcases/lite-chrony-test.sh
          sh scripts/testcases/lite-dhcp6-test.sh
          sh scripts/testcases/lite-usb-mount-test.sh
          sh scripts/testcases/lite-classic-rpc-conf-test.sh
      - name: The interface daemons run confined, the radio chain decides as the oracle says
        run: |
          sh scripts/testcases/lite-radio-confine-test.sh
          sh scripts/testcases/lite-radio-oracle-test.sh
      - name: The boot screen and the board LEDs
        run: |
          sh scripts/testcases/lite-boot-screen-test.sh
          sh scripts/testcases/lite-board-leds-test.sh
          sh scripts/testcases/lite-status-led-dts-test.sh
          sh scripts/testcases/lite-lan-reset-test.sh
      - name: The web server's certificate on a system without an address
        run: sh scripts/testcases/lite-lighttpd-cert-test.sh
      - name: The QEMU test waits for an addon that is still activating
        run: sh scripts/testcases/lite-qemu-settle-test.sh
      - name: The QEMU test cleans up however it ends
        run: sh scripts/testcases/lite-qemu-cleanup-test.sh
      - name: The GitHub release script removes its staging dir
        run: sh scripts/testcases/lite-release-stage-test.sh
      - name: The QEMU test's addon e2e waits for GitHub's rate limit
        run: sh scripts/testcases/lite-qemu-ratelimit-test.sh
      - name: The QEMU test's boot warnings against the allowlist
        run: sh scripts/testcases/lite-boot-warnings-test.sh
      - name: The overlays and the products
        run: |
          sh scripts/testcases/lite-overlay-prune-test.sh
          sh scripts/testcases/lite-smartd-test.sh
      - name: The recovery grows the userfs (a loop device in a privileged container)
        run: sh scripts/testcases/lite-userfs-grow-test.sh
      - name: The recovery removes an upload that fwprepare refused (fwinstall.sh in a container)
        run: sh scripts/testcases/lite-fwprepare-cleanup-test.sh
      - name: The update packages' EULA carries openccu-lite's preamble
        run: sh scripts/testcases/lite-eula-test.sh
      - name: The daily upstream version check decides as its rule says (offline, fixtures)
        run: sh scripts/testcases/lite-upstream-versions-test.sh
