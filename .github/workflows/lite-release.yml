# openccu-lite: the release workflow. lite-only file, never part of an upstream PR.
#
# Runs on the project's own forge only, never on GitHub (every job's `if`; it is also disabled in the
# GitHub repository's Actions settings). A release is built here, on the build host, and published on
# GitHub as a draft through GitHub's API - no self-hosted runner is attached to the public repository.
#
# How a release is made:
#   1. The dev round 1.0.0-dev.<N> is built from a commit of `lite` by the round script on the build
#      host (as root, incrementally in the warm trees, holding /ssd/build/.release.lock) and checked in
#      the lab. Releases keep the dev series for now: the release IS that round, file for file.
#   2. `lite` is on GitHub's `main` at that commit or later (the guard script's push).
#   3. The maintainer pushes the tag v1.0.0-dev.<N> on that commit to this forge. This workflow runs:
#      it checks that the build tree is that commit and the round's images are that version with the
#      pinned occulited, writes SHA256SUMS, creates the draft release v1.0.0-dev.<N> on GitHub with a
#      short header plus GitHub's generated notes, and uploads the assets (zip, ova, ccu3.tgz, SBOMs,
#      their .sha256, SHA256SUMS; no raw .img, no sources archive - the sources are on request).
#      scripts/lite-release-github.sh does the work; `--dry-run` there checks without writing.
#   4. By hand, afterwards: the draft's files are staged on the lab systems; the maintainer signs
#      SHA256SUMS with the offline minisign key (`minisign -Sm SHA256SUMS`), uploads
#      SHA256SUMS.minisig to the draft, edits the notes and publishes - which creates the tag on GitHub.
#
# The secret GH_RELEASE_TOKEN (a repository secret here; a name starting with GITHUB_ is not allowed)
# is a fine-grained GitHub token of the maintainer for hobbyquaker/openccu-lite and
# hobbyquaker/occulited, permission Contents: read and write only, with an expiry. It is used by the
# one step below and nowhere else.
name: lite-release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  draft:
    if: github.server_url != 'https://github.com' && startsWith(github.ref, 'refs/tags/v')
    runs-on: buildroot
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Draft release on GitHub
        env:
          GH_TOKEN: ${{ secrets.GH_RELEASE_TOKEN }}
        run: |
          V="${GITHUB_REF#refs/tags/v}"
          SHA="$(git rev-parse "${GITHUB_REF}^{commit}")"
          # one release at a time, and never while a round script builds in the same trees
          flock -w 3600 /ssd/build/.release.lock scripts/lite-release-github.sh "$V" "$SHA"
