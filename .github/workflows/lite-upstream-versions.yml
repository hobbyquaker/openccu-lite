# openccu-lite: once a day, are the fork's buildroot, kernels and Raspberry Pi firmware current, and
# how long are they supported? Is the JVM the newest Zulu build of its Java line, is HMIPServer older than the
# one at the newest OpenCCU-Base version tag, and which
# relevant OpenCCU-Base commits are above our line (from https://hobbyquaker.github.io/OpenCCU-Base/)?
# scripts/lite-upstream-versions.py reads the pins and compares them with upstream (the components and
# the rule for "current" are in its header) and writes a report page, which this publishes on GitHub
# Pages (source "GitHub Actions"): https://hobbyquaker.github.io/openccu-lite/, with badge.json for the
# README's badge - green "up to date", yellow "updates available", grey "check failed".
#
# Outdated components are not a failure: the run is green, the report and the badge say what is due,
# with a warning annotation each. The run is red only when the check itself fails (a pin not found, an
# upstream unreachable or not parseable - the page then says "check failed") or the deployment does.
# It only reports: no pull request, no issue, no commit.
#
# Runs on GitHub only (the network check; the project's own runner runs the script's offline test in
# lite-build.yml's check job, GitHub's lite-check.yml does too). lite-only file, never part of an
# upstream PR.
name: lite-upstream-versions

on:
  schedule:
    - cron: '17 5 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  versions:
    if: github.server_url == 'https://github.com'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - name: The pins against upstream
        env:
          # GitHub's API (OpenCCU's latest release, the HMIPServer.jar blob shas) above the anonymous rate limit
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/lite-upstream-versions.py --site "$RUNNER_TEMP/site"
      - uses: actions/upload-pages-artifact@v3
        # also after a failed check: the page and the badge then say "check failed"
        if: ${{ !cancelled() }}
        with:
          path: ${{ runner.temp }}/site
      - id: deployment
        if: ${{ !cancelled() }}
        uses: actions/deploy-pages@v4
