name: Bug report
description: Something in openccu-lite does not work as it should - the firmware or occulited, its web interface.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Bugs in the firmware and in [occulited](https://github.com/hobbyquaker/occulited) (the web interface and the system service) both go here.
        A security problem goes to the private report instead, see [SECURITY.md](https://github.com/hobbyquaker/openccu-lite/blob/main/SECURITY.md).
  - type: dropdown
    id: component
    attributes:
      label: Component
      description: Where the problem shows. If you are not sure, pick the closest.
      options:
        - Firmware (boot, radio modules and interface daemons, network, update, recovery)
        - occulited (the web interface, system settings, addons, the APIs)
        - Not sure
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: The Updates page of the web interface shows it.
      placeholder: 1.0.0-beta.0
    validations:
      required: true
  - type: dropdown
    id: product
    attributes:
      label: Product
      description: Which image the system runs.
      options:
        - rpi3 (Raspberry Pi 3)
        - rpi4 (Raspberry Pi 4)
        - ccu3 (eQ-3 CCU3)
        - ova (virtual machine)
        - lxc (container)
    validations:
      required: true
  - type: input
    id: hardware
    attributes:
      label: Radio hardware
      description: The radio module or gateway, if it matters (RPI-RF-MOD, HmIP-RFUSB, HB-RF-ETH, ...).
  - type: textarea
    id: happened
    attributes:
      label: What happened
      description: What you did and what the system did. Steps to reproduce help most.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: |
        The journal around the time it happened: the Log page of the web interface, or `journalctl -b` on the system.
        Please remove anything private (addresses, names, serial numbers) you do not want to publish.
      render: text
