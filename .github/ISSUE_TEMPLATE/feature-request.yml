name: Feature request
description: Something openccu-lite should do or do differently.
labels: ["enhancement"]
body:
  - type: dropdown
    id: component
    attributes:
      label: Component
      description: Where it belongs. If you are not sure, pick the closest.
      options:
        - Firmware (boot, radio modules and interface daemons, network, update, recovery)
        - occulited (the web interface, system settings, addons, the APIs)
        - Not sure
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: The version you run, if you run one (the Updates page shows it).
      placeholder: 1.0.0-dev.28
  - type: dropdown
    id: product
    attributes:
      label: Product
      description: The image it is about, if it is about one.
      multiple: true
      options:
        - rpi3 (Raspberry Pi 3)
        - rpi4 (Raspberry Pi 4)
        - ccu3 (eQ-3 CCU3)
        - ova (virtual machine)
        - lxc (container)
  - type: textarea
    id: wish
    attributes:
      label: What you would like
      description: What the system should do, and what you need it for.
    validations:
      required: true
  - type: textarea
    id: now
    attributes:
      label: What happens now
      description: How it works today, or how you work around it.
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: If the journal shows something that belongs to it (the Log page, or `journalctl -b` on the system).
      render: text
