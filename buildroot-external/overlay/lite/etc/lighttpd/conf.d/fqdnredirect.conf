# openccu-lite: redirect the bare host name to the box's full name, <host>.<domain>.
#
# Included from /var/etc/lighttpd_fqdnredirect.conf, which S50lighttpd writes at start and reload
# when the userfs marker /etc/config/fqdnRedirect holds that name and the live certificate covers
# it; S50 sets var.fqdn_redirect_host (the bare name) and var.fqdn_redirect_target (the full one)
# first. Included on the TLS sockets, and on port 80 only together with the HTTPS redirect and
# after it, so http://<host>/ reaches https://<host>.<domain>/ in one hop. occulited writes the
# marker from System -> Security.
#
# Redirected: GET and HEAD whose Host is exactly the bare name, in any case, with or without a
# port. Left alone: every other name and every address, the API (scripts and addons do not all
# repeat their method and body after a redirect), the ACME challenge path, the UPnP description
# (a UPnP control point does not follow a redirect, and the LOCATION it was given names an
# address, not this name) and the loopback.
# 302, not 301: a browser keeps a 301 for good, past the switch going off or a new domain.
$HTTP["host"] =~ "(?i)^" + var.fqdn_redirect_host + "(?::[0-9]+)?$" {
  $HTTP["request-method"] =~ "^(?:GET|HEAD)$" {
    $HTTP["url"] !~ "^/(?:api(?:/|$)|\.well-known/acme-challenge/|upnp/)" {
      $HTTP["remoteip"] !~ "^(?:127\.0\.0\.1|::ffff:127\.0\.0\.1|::1)$" {
        url.redirect = ("" => "https://" + var.fqdn_redirect_target + "${url.path}${qsa}")
        url.redirect-code = 302
      }
    }
  }
}
