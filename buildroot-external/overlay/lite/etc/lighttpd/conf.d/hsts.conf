# openccu-lite: HTTP Strict Transport Security on the TLS sockets.
#
# Included from /var/etc/lighttpd_hsts.conf, which S50lighttpd writes at start and reload when
# the userfs marker /etc/config/hstsEnabled exists - the marker holds the max-age in seconds,
# S50 puts it into var.hsts_max_age first, then includes this file. occulited writes the marker
# from System → Security and refuses it while the certificate is self-signed: a browser that
# has seen this header refuses an untrusted certificate for the whole max-age. No preload and
# no includeSubDomains - a CCU is one host, and preload cannot be undone.
setenv.add-response-header += ("Strict-Transport-Security" => "max-age=" + var.hsts_max_age)
