#
# openccu-lite: replacement for the upstream webui.conf
#
# There is no ReGaHss on this system (no HTTP backend on 8183) and no
# /www/webui, so the catch-all proxy of the upstream file has nothing to
# proxy to. Everything is served from the document root instead; the
# system service registers its own rules through the drop-in directory
# /etc/config/lighttpd/*.conf, exactly as an addon does.
#

# the upstream WebUI auth backend (auth.backend "rega") does not exist here
auth.require = ()

# .exe/.oxml/.hssml are ReGa script endpoints - nothing serves them
$HTTP["url"] =~ "\.(?:exe|oxml|hssml)" {
  url.access-deny = ( "" )
}

# the system service: /api and the shell proxied to occulited, /addons/ gated (package/occulited)
include "/etc/lighttpd/conf.d/occulited.conf"
