#
# openccu-lite: replacement for the upstream webui.conf
#
# There is no ReGaHss on this system (no HTTP backend on 8183) and no
# /www/webui, so the catch-all proxy of the upstream file has nothing to
# proxy to. Everything is served from the document root instead; the
# system service registers its own rules through the drop-in directory
# /etc/config/lighttpd/*.conf, exactly as an addon does.
#

# the upstream WebUI auth backend (auth.backend "rega") does not exist here
auth.require = ()

# .exe/.oxml/.hssml are ReGa script endpoints - nothing serves them
$HTTP["url"] =~ "\.(?:exe|oxml|hssml)" {
  url.access-deny = ( "" )
}

# the system service: /api and the shell proxied to occulited, /addons/ gated (package/occulited)
include "/etc/lighttpd/conf.d/occulited.conf"

# The files of the CCU's WebUI that addons read: the device pictures, their catalogue
# DEVDB.tcl, stringtable_de.txt and the translations translate.lang*.js, installed by
# package/openccu-base at the CCU's paths under /www. They are served read-only from the document
# root at the CCU's URLs, without a session, as a CCU serves them. Listed after occulited's
# fragment, whose last block hands every other path to the shell: this block takes the proxy away
# again for exactly these paths, so lighttpd's static file handler answers - GET and HEAD, the MIME
# types of conf.d/mime.conf, a 404 for a missing file, and no listing for a directory (no
# mod_dirlisting is loaded). Any other path under /config/ or /webui/ stays the shell's.
$HTTP["url"] =~ "^/(config/(img/devices/|devdescr/DEVDB\.tcl$|stringtable_de\.txt$)|webui/js/lang/[^/]+/translate\.lang[^/]*\.js$)" {
  proxy.server = ()
  magnet.attract-response-start-to = ()
  # a GET: no body (kilobytes)
  server.max-request-size = 1
  $HTTP["request-method"] !~ "^(GET|HEAD)$" {
    url.access-deny = ( "" )
  }
}
