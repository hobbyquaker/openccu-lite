#######################################################################
##
## openccu-lite: the access log is off unless the Log page switches it on.
##
## The journal is the one log on this box, and every request would be a journal entry: the web
## UI polls every few seconds and addon frames add more, which floods the RAM journal and its
## rate limit. So the module is loaded here without a destination, which logs nothing, and the
## Log page's level dialog writes /etc/config/lighttpd/occulite-accesslog.conf (included at the
## end of lighttpd.conf) with the one line that sets it:
##
##   accesslog.filename = "|/usr/bin/systemd-cat -t lighttpd-access -p info"
##
## A pipe rather than accesslog.use-syslog: lighttpd's syslog access log uses the identifier
## lighttpd, the same as its error log, and the Log page could not tell the two apart. The
## destination is set in one place only - lighttpd refuses a second global accesslog.filename.
##
## https://redmine.lighttpd.net/projects/lighttpd/wiki/Docs_ModAccesslog
##
server.modules += ( "mod_accesslog" )

#
#######################################################################
