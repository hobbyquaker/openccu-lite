#
# openccu-lite: replacement for the upstream webui_remoteapi.conf
#
# Not included on lite: S50lighttpd runs /usr/libexec/occu/lite-classic-rpc-conf, which writes
# /var/etc/lighttpd_webui_remoteapi.conf with only the classic RPC sockets the Remote access page
# switched on - never the ReGa ones (1999/8181 and their TLS twins). The interface
# processes stay on the loopback (32000/32001/32010/39292); lighttpd is their door.
#
# Intentionally empty - the file exists because upstream's S50lighttpd includes it.
#
