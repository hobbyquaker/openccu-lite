#
# openccu-lite: the base modules.conf plus mod_magnet, which the session gate in
# front of /addons/ needs (package/occulited), and minus mod_cgi. server.modules is
# global-only, so it cannot come from a conf.d fragment. Keep in step with overlay/base on rebase.
#
# No mod_cgi and no conf.d/cgi.conf: the addons' CGIs run through occulited, which
# conf.d/occulited.conf proxies all of /addons/ to, as the addon's own user (root for a root
# addon) with the environment mod_cgi gave them - no URL reaches a cgi.assign any more, and a
# module that is not loaded cannot be reached by a drop-in either (occulited's drop-in validation
# refuses cgi.* as well). The lite post-build removes the base overlay's cgi.conf from the image.
#
# One change of order: mod_setenv comes before mod_redirect. A redirect finishes the
# request in mod_redirect, and the modules after it never see it - so a redirect
# answered without the headers of conf.d/setenv.conf and without HSTS. Loaded first,
# mod_setenv adds them to the redirects too (the bare host name's redirect on the
# TLS socket then carries Strict-Transport-Security like every other answer there).
#
# And one addition, under mod_magnet below: the removal of a client-sent
# X-Occulite-Session from every request, so only occulited's session gate can set it, and of the
# forwarding headers a client sent (X-Forwarded-For and the like).
#
#######################################################################
##
##  Modules to load
## -----------------
##
## at least mod_access and mod_accesslog should be loaded
## all other module should only be loaded if really neccesary
##
## - saves some time
## - saves memory
##
## the default module set contains:
##
## "mod_indexfile", "mod_dirlisting", "mod_staticfile"
##
## you dont have to include those modules in your list
##
## Modules, which are pulled in via conf.d/*.conf
##
## NOTE: the order of modules is important.
##
## - mod_accesslog     -> conf.d/access_log.conf
## - mod_deflate       -> conf.d/deflate.conf
## - mod_status        -> conf.d/status.conf
## - mod_webdav        -> conf.d/webdav.conf
## - mod_evhost        -> conf.d/evhost.conf
## - mod_simple_vhost  -> conf.d/simple_vhost.conf
## - mod_userdir       -> conf.d/userdir.conf
## - mod_rrdtool       -> conf.d/rrdtool.conf
## - mod_ssi           -> conf.d/ssi.conf
## - mod_cgi           -> conf.d/cgi.conf
## - mod_scgi          -> conf.d/scgi.conf
## - mod_fastcgi       -> conf.d/fastcgi.conf
## - mod_proxy         -> conf.d/proxy.conf
## - mod_expire        -> conf.d/expire.conf
##

server.modules = (
  "mod_access",
#  "mod_alias",
  "mod_authn_file",
  "mod_auth",
  "mod_setenv",
  "mod_redirect",
  "mod_rewrite",
  "mod_proxy",
  "mod_magnet",
  "mod_openssl",
)

##
#######################################################################

#######################################################################
##
##  Config for various Modules
##

##
## mod_access
##
include "conf.d/access.conf"

##
## mod_setenv
##
include "conf.d/setenv.conf"

##
## mod_ssi
##
#include "conf.d/ssi.conf"

##
## mod_status
##
#include "conf.d/status.conf"

##
## mod_webdav
##
#include "conf.d/webdav.conf"

##
## mod_deflate
##
#include "conf.d/deflate.conf"

##
## mod_userdir
##
#include "conf.d/userdir.conf"

##
## mod_magnet
##
#include "conf.d/magnet.conf"

# openccu-lite: occulited's session gate hands an addon the session it validated in
# X-Occulite-Session, so no request may reach any backend with a client-sent one. Set here, in the
# global scope, so it covers every socket and every path - an addon's drop-in may proxy outside
# /addons/ or open a socket of its own - and conf.d/occulited.conf's /addons/ block replaces it with
# the gate, which removes the header itself before it sets it. A drop-in that sets
# magnet.attract-raw-url-to for its own path replaces this too, as it would replace the gate.
# The same script removes a client-sent X-Forwarded-For, X-Forwarded-Proto, X-Forwarded-Host and
# Forwarded: mod_proxy appends to a client's X-Forwarded-For instead of replacing it.
magnet.attract-raw-url-to = ( "/etc/lighttpd/occulite-session-header.lua" )

