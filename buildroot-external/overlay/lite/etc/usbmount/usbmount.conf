# openccu-lite: usbmount's configuration for occu-usb-mount@.service. Upstream's, with
# two changes:
#   - nosuid besides noexec and nodev: nothing on a stick runs;
#   - FAT, exFAT and NTFS carry no owner of their own: root owns the files and the usbstorage group
#     reads and writes them (umask 0007). occulite is in that group, so occulited lists and
#     restores the backups there; a confined addon joins it only by declaring it in its manifest
#     (a stick may hold a backup of the system's keys), and nobody else reads the stick. An image
#     without the group (none ships so) falls back to the occulite group, read only, as before.
#     ext2/3/4, f2fs and hfsplus keep the owners and modes on the stick.
ENABLED=1
MOUNTPOINTS="/media/usb1 /media/usb2 /media/usb3 /media/usb4
             /media/usb5 /media/usb6 /media/usb7 /media/usb8"
FILESYSTEMS="vfat ntfs fuseblk ext2 ext3 ext4 hfsplus exfat f2fs"
MOUNTOPTIONS="noexec,nodev,nosuid,noatime,nodiratime"
lite_gid=$(sed -n 's/^usbstorage:[^:]*:\([0-9][0-9]*\):.*/\1/p' "${LITE_GROUP_FILE:-/etc/group}" 2>/dev/null)
if [ -n "${lite_gid}" ]; then
  lite_owner="uid=0,gid=${lite_gid},umask=0007"
else
  lite_gid=$(sed -n 's/^occulite:[^:]*:\([0-9][0-9]*\):.*/\1/p' "${LITE_GROUP_FILE:-/etc/group}" 2>/dev/null)
  lite_owner="uid=0,gid=${lite_gid:-0},umask=0027"
fi
FS_MOUNTOPTIONS="-fstype=vfat,utf8,${lite_owner} -fstype=exfat,${lite_owner} -fstype=ntfs-3g,nls=utf8,${lite_owner} -fstype=fuseblk,nls=utf8,${lite_owner}"
VERBOSE=no
