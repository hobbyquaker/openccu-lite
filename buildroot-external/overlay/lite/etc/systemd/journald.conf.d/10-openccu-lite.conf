# openccu-lite: journald replaces busybox syslogd/klogd (S07logging), and it is the one log on the
# box: the daemons, lighttpd, hmipserver, the addons and the kernel all write here. The journal
# starts in /run and is flushed to /var/log/journal by occu-persist.service once that directory
# is bind-mounted from the userfs. Storage=auto is load-bearing: journald is persistent exactly
# when /var/log/journal exists, so lite-journal-persist decides by creating that directory or not -
# RAM only by default on the SD-card products, persistent on the userfs for ova and lxc. The
# limits below are the defaults; /etc/config/journal overrides them per box (STORAGE,
# RUNTIME_MAX_USE, SYSTEM_MAX_USE, ...). 32 MiB on a CCU3-class box is weeks of logs.
#
# The overrides are lite-journal-persist's drop-in /run/systemd/journald.conf.d/50-openccu-lite-box.conf,
# and journald applies drop-ins in the order of their file names, whatever directory they are in:
# this file's name has to sort before that one's, or its Storage=auto and its sizes win over the
# box's Storage=volatile (ram-sync) and limits. Named openccu-lite.conf it did, and ram-sync's
# journald wrote the userfs after every restart.
[Journal]
Storage=auto
SystemMaxUse=32M
RuntimeMaxUse=16M
Compress=yes
# One journal file, not one per user: journald's SplitMode=uid default opens a user-<uid>.journal for
# every non-system uid that logs - each addon's user and occulited's - and allocates each at the
# file size, SystemMaxUse/8. On the VM nine active files (system, four addon users, occulited's
# four) took 36M against SystemMaxUse=32M, and the vacuum, which never removes an active file,
# removed every archived one at each rotation: the persistent journal kept no earlier boot. The
# split buys nothing here: systemd is built without ACL support, so a user cannot read its own file
# anyway, and occulited reads the journal through the systemd-journal group. The RAM journal is
# never split. lite-journal-persist archives the user files an earlier image left, so the vacuum
# can take them.
SplitMode=none
# Remote syslog: occu-syslog-forward reads the journal itself (journalctl -f) and sends it to
# LOGHOST of /etc/config/syslog. Nothing reads journald's syslog forward socket, so journald is
# not asked to write to it: that was a failed write per message.
ForwardToSyslog=no
ForwardToConsole=no
