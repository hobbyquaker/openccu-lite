# openccu-lite: PID 1 feeds the hardware watchdog.
#
# S00watchdog started busybox "watchdog -T 300 -t 5 /dev/watchdog": a process that keeps writing
# to the device happily while PID 1 is wedged - which is the failure a watchdog exists for.
# systemd opens /dev/watchdog itself when RuntimeWatchdogSec= is set and pings it from the
# manager loop, so a hung PID 1 is what stops the pings. occu-watchdog.service is gone with this
# file; occu-watchdog-marker.service (the unclean-shutdown marker, the other half of
# S00watchdog) stays.
#
# 10 s, not the 300 s the busybox feeder asked for: on the Pi the device comes from
# "bcm2835_wdt nowayout=1 heartbeat=15" (S06InitSystem) and that driver's timeout tops out at
# ~15 s, so anything larger is silently clamped. systemd pings at half the timeout. On
# x86_64-ova there is usually no watchdog device at all (an emulated i6300esb is not a Proxmox
# default) and this line then does nothing but log one line.
#
# UNVERIFIED until tested on a Pi (docs/systemd-scope.md, "The hardware watchdog"): bcm2835_wdt is a
# module loaded by S06InitSystem, i.e. after PID 1 has set its watchdog up, so the box has to
# show that PID 1 picks the device up when it appears (systemd re-opens it on the next ping) and
# that a nowayout driver survives the handover. If it does not, the fix is to load the module
# from /etc/modules-load.d or to build the driver in, not to bring the feeder back.
[Manager]
RuntimeWatchdogSec=10s
RebootWatchdogSec=1min
