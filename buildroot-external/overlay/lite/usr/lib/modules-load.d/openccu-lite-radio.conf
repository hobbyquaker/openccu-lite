# openccu-lite: the multiplexer's loop driver is loaded at boot, not by multimacd's unit.
#
# multimacd.service is confined (ProtectKernelModules=), and that hides /lib/modules from every
# step of the unit, the root ones included: a modprobe from inside the unit finds no module. The
# script's own modprobe therefore only ever worked while the module was already loaded, and a
# restart after an unload failed. The unit no longer unloads the module at stop (upstream did that
# for container hosts, which openccu-lite's LXC products cannot do anyway - the host owns the
# modules, and their post-build drops this file).
eq3_char_loop
