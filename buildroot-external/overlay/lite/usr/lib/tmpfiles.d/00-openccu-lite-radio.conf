# openccu-lite: what the confined interface daemons need at boot.
#
# /run/lock: hmipserver's serial library (NRJavaSerial) takes a UUCP-style lock file there for
# the node it opens, LCK..mmd_hmip. systemd's legacy.conf makes the directory 0755 root; here it
# is 1775 root:lock, and hmipserver.service is in the lock group. The first file in lexical
# order wins for a path, and "00-" sorts before "legacy.conf".
d /run/lock 1775 root lock -
# the prep helper's environment files for the daemons' command lines
d /run/occulite/radio 0755 root root -
# hmipserver's own place on the /var tmpfs: the diagram database (diagramDatabasePath), which
# the service copies from the USB stick at start and back at stop; /tmp is private to the unit
d /var/hmipserver 0750 hmipserver hmipserver -
# hs485d's private /var takes /var/run and /var/log from here (BindPaths= in its unit). The bind
# sources have to exist before the unit's first step runs - a "+" step is still inside the mount
# namespace when the unit has bind mounts - so they are made at boot, not by the prep helper alone.
d /run/hs485d 0750 hs485d hs485d -
d /run/hs485d/run 0750 hs485d hs485d -
d /run/hs485d/log 0750 hs485d hs485d -
# hs485d's list of registered XML-RPC callbacks, which its unit binds into the private /var
# it shows the daemon. The bind needs a source that exists before the unit starts, and a file that
# is not there is skipped silently - so the daemon would write into the tmpfs and the Interfaces
# page would show no subscriber. rfd's equivalent needs no entry: its /var is the real one.
f /var/HS485D.handlers 0644 hs485d hs485d -
