# openccu-lite: the base of lighttpd's web ingress sockets for addons, /run/lighttpd-addons/<id>/
# proxy.sock (an addon's manifest declares runtime.web_ingress; occulited renders the socket's
# lighttpd block into /etc/config/lighttpd/occulite-ingress-<id>.conf and makes the directory,
# www-data's with the addon's group, 0750). lighttpd runs as www-data in a sandbox whose /run is
# read-only but for this tree (ReadWritePaths in lighttpd.service) and cannot make a directory
# here; the base is root's, so nothing but occulited (and lite-lighttpd-addon-socket, the safety
# net in lighttpd-prepare.service) makes an addon's directory in it.
d /run/lighttpd-addons 0755 root root -
