# openccu-lite: /var/run is the link to /run, also when something made it a directory first.
#
# /var is a tmpfs mounted at boot, and systemd's var.conf creates the link with "L", which leaves an
# existing directory alone. Whatever writes under /var/run between the /var mount and this service -
# a udev rule's program during the coldplug, which is ordered against neither - would leave a real
# directory there, and every daemon's pid file would land where its unit does not look. "L+" replaces
# the directory with the link. This file sorts before var.conf, so its line is the one applied.
L+ /var/run - - - - ../run
