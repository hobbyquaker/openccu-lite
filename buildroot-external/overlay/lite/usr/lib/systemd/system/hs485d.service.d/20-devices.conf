# openccu-lite: the device nodes the wired daemon may open - serial adapters (ttyS, ttyUSB, a
# USB-serial converter's ttyACM); a wired LAN gateway is reached over TCP. The container products
# drop this file: without udev inside the container the host maps the nodes, and a device policy
# may not be applied in a nested cgroup.
[Service]
DevicePolicy=closed
DeviceAllow=char-ttyS rw
DeviceAllow=char-ttyUSB rw
DeviceAllow=char-ttyACM rw
