# openccu-lite: the device nodes rfd may open - the multiplexer's BidCos-RF endpoint
# (/dev/mmd_bidcos, class eq3loop) and an HM-CFG-USB-2 through libusb. The container products
# drop this file: without udev inside the container the host maps the nodes, and a device
# policy may not be applied in a nested cgroup.
[Service]
DevicePolicy=closed
DeviceAllow=char-eq3loop rw
DeviceAllow=char-usb_device rw
