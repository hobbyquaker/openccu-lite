# openccu-lite: the device nodes the HmIP server may open - the multiplexer's HmIP endpoint
# (/dev/mmd_hmip, class eq3loop) and the radio module's raw UART where it uses the module
# directly (an HmIP-RFUSB beside an HM-CFG-USB-2). The container products drop this file:
# without udev inside the container the host maps the nodes, and a device policy may not be
# applied in a nested cgroup.
[Service]
DevicePolicy=closed
DeviceAllow=char-eq3loop rw
DeviceAllow=char-raw-uart rw
