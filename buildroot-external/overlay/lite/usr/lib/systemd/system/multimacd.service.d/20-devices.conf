# openccu-lite: the device nodes multimacd may open - the radio module's raw UART (class
# raw-uart) and the multiplexer's master device /dev/eq3loop (class eq3loop). The container
# products drop this file: without udev inside the container the host maps the nodes, and a
# device policy may not be applied in a nested cgroup.
[Service]
DevicePolicy=closed
DeviceAllow=char-raw-uart rw
DeviceAllow=char-eq3loop rw
