# openccu-lite: occulited's status LED controller writes kernel triggers, which keep
# blinking after the daemon is gone. When it stops, the LED says so: yellow, slow blink - or the
# shutdown pattern while the box goes down. The controller sets its own frame again at its next
# start. As root ("+"): the daemon's user has no write access to the LED.
[Service]
ExecStopPost=-+/usr/libexec/occu/lite-status-led stopped
