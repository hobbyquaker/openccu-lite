# openccu-lite: the boot splash only where there is a framebuffer when the splash starts.
# A headless board has none at that point, and psplash failed at every boot with
# "Error opening /dev/fb0", which left a failed unit on the Services page. It is skipped instead;
# psplash-systemd is bound to this unit and is skipped with it.
#
# A framebuffer that appears later starts it through udev (62-openccu-lite-psplash.rules). A simple
# framebuffer can be gone again between that event and psplash's open (the Pi's display driver takes
# it over): psplash then ends with 255 ("return -1" when it cannot open the framebuffer), which is
# no failure of the system.
[Unit]
ConditionPathExists=/dev/fb0

[Service]
SuccessExitStatus=255
