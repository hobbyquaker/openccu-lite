# openccu-lite: a route on an interface without a link does not count. With Ethernet and Wi-Fi
# both up, a pulled cable hands the default route to the other interface (the kernel otherwise
# keeps using the dead one's route until the interface is taken down).
net.ipv4.conf.all.ignore_routes_with_linkdown = 1
net.ipv4.conf.default.ignore_routes_with_linkdown = 1
net.ipv6.conf.all.ignore_routes_with_linkdown = 1
net.ipv6.conf.default.ignore_routes_with_linkdown = 1
