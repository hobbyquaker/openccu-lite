# openccu-lite: the ACME HTTP-01 challenge stays on port 80 - a CA fetches
# /.well-known/acme-challenge/<token> in the clear, and occulited answers it there
# (conf.d/occulited.conf).
#
# So does the UPnP device description: the LOCATION of an SSDP announcement has
# always been a plain http:// URL, and a control point - the Windows Explorer Network view, a
# scanner - does not follow a redirect and would not get past this system's certificate either.
# The description is public, read-only XML with nothing in it that the announcement does not
# already carry over the air; the page it points at is the HTTPS one.
#
# Everything else from off the system goes to HTTPS, as upstream has it.
$HTTP["url"] !~ "^/(?:\.well-known/acme-challenge/|upnp/)" {
  $HTTP["remoteip"] !~ "^(?:127\.0\.0\.1|::ffff:127\.0\.0\.1|::1)$" {
    url.redirect = ("" => "https://${url.authority}${url.path}${qsa}")
  }
}
