# TCP Port for XmlRpc connections
#
# openccu-lite binds the interface processes to the loopback: everything
# that speaks XML-RPC runs on this box - the system service, the frontend addon,
# a bridge addon - and the outside world talks to those, authenticated. There
# are no lighttpd proxies on 2001/2000/2010 here either.
Listen IP = 127.0.0.1
Listen Port = 32001

Log Destination = Syslog
Log Identifier = rfd
Log Level = 1

Persist Keys = 1

# PID File = /var/rfd.pid
# UDS File = /var/socket_rfd

Device Description Dir = /firmware/rftypes
Device Files Dir = /etc/config/rfd
Key File = /etc/config/keys
Address File = /etc/config/ids
Firmware Dir = /firmware
Replacemap File = /firmware/rftypes/replaceMap/rfReplaceMap.xml
Fire NACK Error Events = true
Improved Coprocessor Initialization = true

#[Interface 0]
#Type = CCU2
#ComPortFile = /dev/mmd_bidcos
##AccessFile = /dev/null
##ResetFile = /dev/null

[Interface 1]
Type = USB Interface
Name = HM-CFG-USB
Serial Number = JEQ0534849
Encryption Key =
